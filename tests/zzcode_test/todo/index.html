<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>极简待办清单</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 520px;
      padding: 32px 28px;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 20px;
      text-align: center;
      letter-spacing: 1px;
    }

    .input-area {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
    }

    .input-area input {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.25s;
    }

    .input-area input:focus {
      border-color: #6c63ff;
    }

    .input-area button {
      padding: 12px 20px;
      background: #6c63ff;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.25s, transform 0.1s;
      white-space: nowrap;
    }

    .input-area button:hover {
      background: #5a52d5;
    }

    .input-area button:active {
      transform: scale(0.96);
    }

    /* ---- 统计栏 ---- */
    .stats {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: #888;
      margin-bottom: 12px;
      padding: 0 2px;
    }

    .stats .count span {
      font-weight: 700;
      color: #6c63ff;
    }

    .clear-done-btn {
      background: none;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      padding: 4px 12px;
      font-size: 12px;
      color: #999;
      cursor: pointer;
      transition: all 0.2s;
    }

    .clear-done-btn:hover {
      border-color: #ff6b6b;
      color: #ff6b6b;
      background: #fff5f5;
    }

    /* ---- 筛选标签 ---- */
    .filters {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    .filter-btn {
      flex: 1;
      padding: 6px 0;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      background: #fafafa;
      font-size: 13px;
      color: #888;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }

    .filter-btn:hover {
      border-color: #6c63ff;
      color: #6c63ff;
    }

    .filter-btn.active {
      background: #6c63ff;
      border-color: #6c63ff;
      color: #fff;
    }

    /* ---- 待办列表 ---- */
    .todo-list {
      list-style: none;
    }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 10px;
      background: #f8f9fc;
      margin-bottom: 8px;
      transition: background 0.2s;
    }

    .todo-item:hover {
      background: #eef0f7;
    }

    .todo-item .checkbox {
      width: 20px;
      height: 20px;
      border: 2px solid #ccc;
      border-radius: 50%;
      flex-shrink: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      font-size: 12px;
      color: transparent;
      user-select: none;
    }

    .todo-item .checkbox:hover {
      border-color: #6c63ff;
    }

    .todo-item .checkbox.checked {
      background: #6c63ff;
      border-color: #6c63ff;
      color: #fff;
    }

    .todo-item .text {
      font-size: 15px;
      color: #333;
      word-break: break-word;
      flex: 1;
      cursor: text;
      transition: color 0.2s;
    }

    .todo-item .text.done {
      text-decoration: line-through;
      color: #bbb;
    }

    .todo-item .edit-input {
      flex: 1;
      padding: 6px 10px;
      border: 2px solid #6c63ff;
      border-radius: 6px;
      font-size: 15px;
      outline: none;
    }

    .todo-item .delete-btn {
      background: none;
      border: none;
      color: #ff6b6b;
      font-size: 18px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      transition: background 0.2s, color 0.2s;
      line-height: 1;
      flex-shrink: 0;
    }

    .todo-item .delete-btn:hover {
      background: #ffe0e0;
      color: #e03131;
    }

    .empty-tip {
      text-align: center;
      color: #aaa;
      font-size: 14px;
      padding: 30px 0 10px;
    }

    .footer {
      margin-top: 20px;
      text-align: center;
      font-size: 13px;
      color: #bbb;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📋 待办清单</h1>

    <div class="input-area">
      <input type="text" id="todoInput" placeholder="输入新任务..." autofocus>
      <button id="addBtn">添加</button>
    </div>

    <!-- 统计栏 -->
    <div class="stats">
      <div class="count">总计 <span id="totalCount">0</span> · 已完成 <span id="doneCount">0</span></div>
      <button class="clear-done-btn" id="clearDoneBtn">🗑 清空已完成</button>
    </div>

    <!-- 筛选 -->
    <div class="filters">
      <button class="filter-btn active" data-filter="all">全部</button>
      <button class="filter-btn" data-filter="active">待办</button>
      <button class="filter-btn" data-filter="done">已完成</button>
    </div>

    <ul class="todo-list" id="todoList">
      <li class="empty-tip">还没有任务，添加一条吧 ✨</li>
    </ul>

    <div class="footer">点击 ✓ 标记完成 · 双击文字编辑 · 点击 ✕ 删除</div>
  </div>

  <script>
    const input = document.getElementById('todoInput');
    const addBtn = document.getElementById('addBtn');
    const list = document.getElementById('todoList');
    const totalCount = document.getElementById('totalCount');
    const doneCount = document.getElementById('doneCount');
    const clearDoneBtn = document.getElementById('clearDoneBtn');

    // 数据：每个任务 { text, done }
    let todos = JSON.parse(localStorage.getItem('todos') || '[]');
    let currentFilter = 'all'; // 'all' | 'active' | 'done'

    // ---- 渲染 ----
    function render() {
      const filtered = getFilteredTodos();

      list.innerHTML = '';
      if (filtered.length === 0) {
        const msg = currentFilter === 'all'   ? '还没有任务，添加一条吧 ✨'
                  : currentFilter === 'active' ? '🎉 所有任务都已完成！'
                  : '暂无已完成的任务';
        list.innerHTML = `<li class="empty-tip">${msg}</li>`;
      } else {
        filtered.forEach((todo, idx) => {
          const li = document.createElement('li');
          li.className = 'todo-item';

          const checkDiv = document.createElement('div');
          checkDiv.className = 'checkbox' + (todo.done ? ' checked' : '');
          checkDiv.textContent = '✓';
          checkDiv.addEventListener('click', () => toggleDone(todo._rawIndex));

          const textSpan = document.createElement('span');
          textSpan.className = 'text' + (todo.done ? ' done' : '');
          textSpan.textContent = todo.text;
          // 双击编辑
          textSpan.addEventListener('dblclick', () => startEdit(li, todo, textSpan));

          const delBtn = document.createElement('button');
          delBtn.className = 'delete-btn';
          delBtn.textContent = '✕';
          delBtn.title = '删除任务';
          delBtn.addEventListener('click', () => deleteTodo(todo._rawIndex));

          li.appendChild(checkDiv);
          li.appendChild(textSpan);
          li.appendChild(delBtn);
          list.appendChild(li);
        });
      }

      updateStats();
      updateFilterBtns();
    }

    // ---- 获取筛选后的数据（附加原始索引） ----
    function getFilteredTodos() {
      return todos
        .map((t, i) => ({ ...t, _rawIndex: i }))
        .filter(t => {
          if (currentFilter === 'active') return !t.done;
          if (currentFilter === 'done') return t.done;
          return true;
        });
    }

    // ---- 切换完成状态 ----
    function toggleDone(index) {
      todos[index].done = !todos[index].done;
      saveAndRender();
    }

    // ---- 删除 ----
    function deleteTodo(index) {
      todos.splice(index, 1);
      saveAndRender();
    }

    // ---- 双击编辑 ----
    function startEdit(li, todo, textSpan) {
      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'edit-input';
      input.value = todo.text;
      li.insertBefore(input, textSpan);
      li.removeChild(textSpan);

      input.focus();
      input.select();

      function finish() {
        const val = input.value.trim();
        if (val) {
          todos[todo._rawIndex].text = val;
          saveAndRender();
        } else {
          render(); // 放弃编辑
        }
      }

      input.addEventListener('blur', finish);
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { input.blur(); }
        if (e.key === 'Escape') { render(); }
      });
    }

    // ---- 更新统计 ----
    function updateStats() {
      const total = todos.length;
      const done = todos.filter(t => t.done).length;
      totalCount.textContent = total;
      doneCount.textContent = done;
    }

    // ---- 更新筛选按钮高亮 ----
    function updateFilterBtns() {
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.filter === currentFilter);
      });
    }

    // ---- 保存 + 渲染 ----
    function saveAndRender() {
      localStorage.setItem('todos', JSON.stringify(todos));
      render();
    }

    // ---- 添加 ----
    function addTodo() {
      const text = input.value.trim();
      if (!text) return;
      todos.push({ text, done: false });
      input.value = '';
      saveAndRender();
      input.focus();
    }

    // ---- 清空已完成 ----
    clearDoneBtn.addEventListener('click', () => {
      todos = todos.filter(t => !t.done);
      saveAndRender();
    });

    // ---- 筛选切换 ----
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', function () {
        currentFilter = this.dataset.filter;
        render();
      });
    });

    // ---- 事件绑定 ----
    addBtn.addEventListener('click', addTodo);
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') addTodo();
    });

    // 初始渲染
    render();
  </script>
</body>
</html>
